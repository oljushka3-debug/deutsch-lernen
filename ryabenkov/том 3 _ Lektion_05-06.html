    <script>
        const lessons = [
            // ================= Lektion 05 =================
            {
                id: 5,
                title: 'Lektion 05',
                subtitle: 'Dativ, приставки, время и числительные',
                goals: [
                    'научитесь расставлять ударение в словах с отделяемыми и неотделяемыми приставками',
                    'познакомитесь с дательным падежом Dativ',
                    'узнаете предлоги времени um, an, in',
                    'научитесь указывать точное время, время суток, дни недели, месяцы',

                ],
                sections: [
                    {
                        title: 'Ударение в словах с приставками',
                        content: `
                            <div class="theory-block">
                                <p>В немецком языке, как и в русском языке, есть глаголы с приставками (подъехать, уехать, приехать, наехать и тд.)</p>
                                <p style="margin-top: 10px;">В немецком языке приставки делятся на две группы: <strong>Неотделяемые</strong> и <strong>Отделяемые</strong>.</p>
                                <p style="margin-top: 10px;">Неотделяемые (<strong>be, ge, er, ver, zer, ent, emp, miss</strong>) никогда не стоят под ударением.</p>
                                <p style="margin-top: 10px;">Отделяемые (<strong>durch, mit, vor, auf, ein, aus, über, nach</strong> и т.д.) - наоборот, всегда ударные. Они отделяются и уходят в конец предложения.</p>
                            </div>
                            
                            <h3>Повторите за мной следующие слова:</h3>
                            <div class="example">
                                <strong>Неотделяемые:</strong><br>
                                <span class="speak-vocab">begegnen</span> (встречать, сталкиваться)<br>
                                <span class="speak-vocab">geschehen</span> (происходить, случаться)<br>
                                <span class="speak-vocab">erzählen</span> (рассказывать)<br>
                                <span class="speak-vocab">verkaufen</span> (продавать)<br>
                                <span class="speak-vocab">zerreißen</span> (рвать, разрывать)<br>
                                <span class="speak-vocab">entschuldigen</span> (извинять, прощать)<br>
                                <span class="speak-vocab">empfinden</span> (чувствовать, ощущать)<br>
                                <span class="speak-vocab">misstrauen</span> (не доверять, подозревать)
                            </div>
                            <div class="example">
                                <strong>Отделяемые:</strong><br>
                                <span class="speak-vocab">einschalten</span> (включать прибор)<br>
                                <span class="speak-vocab">ausgehen</span> (выходить куда-то)<br>
                                <span class="speak-vocab">aufstehen</span> (вставать, подниматься)<br>
                                <span class="speak-vocab">mitmachen</span> (участвовать, присоединяться)<br>
                                <span class="speak-vocab">zubereiten</span> (готовить еду)<br>
                                <span class="speak-vocab">vorlesen</span> (читать вслух)
                            </div>

                            <h3 style="margin-top: 20px;">Давайте рассмотрим примеры:</h3>
                            <div class="example">
                                <div class="example-text"><span class="speak-sentence">Ich stehe jeden Morgen um 7 Uhr auf.</span></div><div class="translation">Я встаю каждое утро в 7 часов.</div>
                            </div>
                            <div class="example">
                                <div class="example-text"><span class="speak-sentence">Er schaltet das Licht ein.</span></div><div class="translation">Он включает свет.</div>
                            </div>
                            <div class="example">
                                <div class="example-text"><span class="speak-sentence">Wir gehen heute Abend aus.</span></div><div class="translation">Мы сегодня вечером выходим.</div>
                            </div>
                            <div class="example">
                                <div class="example-text"><span class="speak-sentence">Machst du mit?</span></div><div class="translation">Ты участвуешь?</div>
                            </div>
                            <div class="example">
                                <div class="example-text"><span class="speak-sentence">Sie liest eine Geschichte vor.</span></div><div class="translation">Она читает рассказ вслух.</div>
                            </div>
                            <div class="example">
                                <div class="example-text"><span class="speak-sentence">Ich bereite das Essen zu.</span></div><div class="translation">Я готовлю еду.</div>
                            </div>
                            <div class="example">
                                <div class="example-text"><span class="speak-sentence">Was empfindest du?</span></div><div class="translation">Что ты чувствуешь? (empfinden - неотделяемая)</div>
                            </div>
                        `
                    },
                    {
                        title: 'Дательный падеж Dativ',
                        content: `
                            <div class="theory-block">
                                <p>В немецком языке есть дательный падеж <strong>Dativ</strong>, слова в котором отвечают на вопросы: <strong>кому? wem? когда? wann?</strong></p>
                                <p style="margin-top: 10px;">Для того, чтобы употребить существительные в дательном падеже Dativ, нужно использовать артикль в правильной форме.</p>
                                <p style="margin-top: 10px;"><strong>Важно:</strong> В Dativ во множественном числе к существительному нужно прибавить <strong>-n</strong>.</p>
                            </div>
                            
                            <h3>Склонение артиклей в Dativ</h3>
                            <table>
                                <tr><th>Падеж</th><th>Мужской род (der)</th><th>Средний род (das)</th><th>Женский род (die)</th><th>Мн. число (die)</th></tr>
                                <tr><td>Nominativ</td><td>der / ein Mann</td><td>das / ein Kind</td><td>die / eine Frau</td><td>die Bücher</td></tr>
                                <tr><td>Akkusativ</td><td>den / einen Mann</td><td>das / ein Kind</td><td>die / eine Frau</td><td>die Bücher</td></tr>
                                <tr><td><strong>Dativ</strong></td><td><strong>dem / einem</strong> Mann</td><td><strong>dem / einem</strong> Kind</td><td><strong>der / einer</strong> Frau</td><td><strong>den</strong> Bücher<strong>n</strong></td></tr>
                            </table>

                            <h3 style="margin-top: 20px;">Склонение отрицательного артикля kein в Dativ</h3>
                            <table>
                                <tr><th>Падеж</th><th>Мужской род</th><th>Средний род</th><th>Женский род</th><th>Мн. число</th></tr>
                                <tr><td>Nominativ</td><td>kein Mann</td><td>kein Kind</td><td>keine Frau</td><td>keine Bücher</td></tr>
                                <tr><td>Akkusativ</td><td>keinen Mann</td><td>kein Kind</td><td>keine Frau</td><td>keine Bücher</td></tr>
                                <tr><td><strong>Dativ</strong></td><td><strong>keinem</strong> Mann</td><td><strong>keinem</strong> Kind</td><td><strong>keiner</strong> Frau</td><td><strong>keinen</strong> Bücher<strong>n</strong></td></tr>
                            </table>

                            <h3 style="margin-top: 20px;">Склонение притяжательных артиклей в Dativ</h3>
                            <table>
                                <tr><th>Кто?</th><th>Мужской (dem)</th><th>Средний (dem)</th><th>Женский (der)</th><th>Множ. (den + n)</th></tr>
                                <tr><td>ich</td><td><strong>meinem</strong></td><td><strong>meinem</strong></td><td><strong>meiner</strong></td><td><strong>meinen</strong></td></tr>
                                <tr><td>du</td><td><strong>deinem</strong></td><td><strong>deinem</strong></td><td><strong>deiner</strong></td><td><strong>deinen</strong></td></tr>
                                <tr><td>er</td><td><strong>seinem</strong></td><td><strong>seinem</strong></td><td><strong>seiner</strong></td><td><strong>seinen</strong></td></tr>
                                <tr><td>sie</td><td><strong>ihrem</strong></td><td><strong>ihrem</strong></td><td><strong>ihrer</strong></td><td><strong>ihren</strong></td></tr>
                                <tr><td>es</td><td><strong>seinem</strong></td><td><strong>seinem</strong></td><td><strong>seiner</strong></td><td><strong>seinen</strong></td></tr>
                                <tr><td>wir</td><td><strong>unserem</strong></td><td><strong>unserem</strong></td><td><strong>unserer</strong></td><td><strong>unseren</strong></td></tr>
                                <tr><td>ihr</td><td><strong>eurem</strong></td><td><strong>eurem</strong></td><td><strong>eurer</strong></td><td><strong>euren</strong></td></tr>
                                <tr><td>sie</td><td><strong>ihrem</strong></td><td><strong>ihrem</strong></td><td><strong>ihrer</strong></td><td><strong>ihren</strong></td></tr>
                                <tr><td>Sie</td><td><strong>Ihrem</strong></td><td><strong>Ihrem</strong></td><td><strong>Ihrer</strong></td><td><strong>Ihren</strong></td></tr>
                            </table>

                            <h3 style="margin-top: 20px;">Примеры:</h3>
                            <div class="example">
                                <div class="example-text"><span class="speak-sentence">Der Vater schenkt dem Sohn.</span></div><div class="translation">Папа дарит (кому? чему? - Dativ) сыну.</div>
                            </div>
                            <div class="example">
                                <div class="example-text"><span class="speak-sentence">Die Mutter erzählt ihrem Kind.</span></div><div class="translation">Мама рассказывает (кому? чему? - Dativ) своему ребенку.</div>
                            </div>
                            <div class="example">
                                <div class="example-text"><span class="speak-sentence">Die Eltern helfen einer Frau.</span></div><div class="translation">Родители помогают (кому? чему? - Dativ) женщине.</div>
                            </div>
                            <div class="example">
                                <div class="example-text"><span class="speak-sentence">Die Bücher gehören keinen Kindern.</span></div><div class="translation">Книги принадлежат (кому? чему? - Dativ) не детям. (обратите внимание на -n в Kindern)</div>
                            </div>
                        `
                    },
                    {
                        title: 'Личные местоимения в Dativ',
                        content: `
                            <div class="theory-block">
                                <p>Давайте вспомним личные местоимения, которые вы уже знаете: "я" (ich), "ты" (du), "он" (er) и так далее. Сегодня мы научимся использовать их в Дательном падеже (Dativ), что означает, что они будут выглядеть так: "мне" (mir), "тебе" (dir), "ему" (ihm) и т.д.</p>
                            </div>
                            <table>
                                <tr><th>Nominativ (кто? что?)</th><th>Dativ (кому? чему?)</th></tr>
                                <tr><td>ich (я)</td><td><strong>mir</strong> (мне)</td></tr>
                                <tr><td>du (ты)</td><td><strong>dir</strong> (тебе)</td></tr>
                                <tr><td>er (он)</td><td><strong>ihm</strong> (ему)</td></tr>
                                <tr><td>sie (она)</td><td><strong>ihr</strong> (ей)</td></tr>
                                <tr><td>es (оно)</td><td><strong>ihm</strong> (ему)</td></tr>
                                <tr><td>wir (мы)</td><td><strong>uns</strong> (нам)</td></tr>
                                <tr><td>ihr (вы)</td><td><strong>euch</strong> (вам)</td></tr>
                                <tr><td>sie (они)</td><td><strong>ihnen</strong> (им)</td></tr>
                                <tr><td>Sie (Вы)</td><td><strong>Ihnen</strong> (Вам)</td></tr>
                            </table>
                        `
                    },
                    {
                        title: 'Числительные',
                        content: `
                            <div class="theory-block">
                                <p>Обращайте внимание на принцип построения числительных с 13 до 19. Например: 19 neunzehn (9 neun + 10 zehn).</p>
                            </div>
                            <h3>Числительные до 19</h3>
                            <table>
                                <tr><th>0-9</th><th>10-19</th></tr>
                                <tr><td>0 null</td><td>10 zehn</td></tr>
                                <tr><td>1 eins</td><td>11 elf</td></tr>
                                <tr><td>2 zwei</td><td>12 zwölf</td></tr>
                                <tr><td>3 drei</td><td>13 dreizehn (3+10)</td></tr>
                                <tr><td>4 vier</td><td>14 vierzehn (4+10)</td></tr>
                                <tr><td>5 fünf</td><td>15 fünfzehn (5+10)</td></tr>
                                <tr><td>6 sechs</td><td>16 sechzehn</td></tr>
                                <tr><td>7 sieben</td><td>17 siebzehn</td></tr>
                                <tr><td>8 acht</td><td>18 achtzehn (8+10)</td></tr>
                                <tr><td>9 neun</td><td>19 neunzehn (9+10)</td></tr>
                            </table>

                            <h3 style="margin-top: 20px;">Числительные до 100</h3>
                            <table>
                                <tr><td>10 zehn</td><td>21 einundzwanzig (1 и 20)</td></tr>
                                <tr><td>20 zwanzig</td><td>22 zweiundzwanzig (2 и 20)</td></tr>
                                <tr><td>30 dreißig</td><td>23 dreiundzwanzig (3 и 20)</td></tr>
                                <tr><td>40 vierzig</td><td>24 vierundzwanzig (4 и 20)</td></tr>
                                <tr><td>50 fünfzig</td><td>25 fünfundzwanzig (5 и 20)</td></tr>
                                <tr><td>60 sechzig</td><td>26 sechsundzwanzig (6 и 20)</td></tr>
                                <tr><td>70 siebzig</td><td>27 siebenundzwanzig</td></tr>
                                <tr><td>80 achtzig</td><td>28 achtundzwanzig</td></tr>
                                <tr><td>90 neunzig</td><td>29 neunundzwanzig</td></tr>
                            </table>
                            <p style="margin-top: 10px;"><strong>100 - (ein) hundert</strong></p>
                        `
                    },
                    {
                        title: 'Время',
                        content: `
                            <div class="theory-block">
                                <p>Чтобы назвать текущее время, необходимо сперва назвать часы в 24-часовом формате, следом идет слово Uhr (час), а уже потом идут минуты цифрой.</p>
                                <p><strong>Важно!</strong> Слово «минуты» НЕ говорится!</p>
                            </div>
                            
                            <div class="time-header-bubbles">
                                <div class="time-bubble">Wie spät ist es?</div>
                                <div class="time-bubble">Es ist 13:45.</div>
                            </div>

                            <div class="time-boxes-container">
                                <div class="time-box">
                                    <p><strong>14:23</strong> — <span class="speak-sentence">vierzehn Uhr dreiundzwanzig</span></p>

        let customIsSpeaking = false;
        let currentPauseBtn = null;

        function initVoice() {
            let voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;
            const priorityKeywords = ['Google', 'Premium', 'Enhanced', 'Neural', 'Natural', 'Online'];
            germanVoice = voices.find(v => v.lang.startsWith('de') && priorityKeywords.some(k => v.name.includes(k)));
            if (!germanVoice) {
                germanVoice = voices.find(v => v.lang.startsWith('de'));
            }
        }

        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = initVoice;
        }

        function resetAllPauseButtons() {
            document.querySelectorAll('.pause-btn').forEach(btn => {
                btn.innerHTML = '⏸️';
                btn.title = 'Пауза';
            });
        }

        function stopAllAudio() {
            window.speechSynthesis.cancel();
            customIsSpeaking = false;
            customIsPaused = false;
            resetAllPauseButtons();
        }

        function speakText(text, pauseBtnElement = null) {
            stopAllAudio();
            textChunks = text.match(/[^.!?]+[.!?]*/g) || [text];
            textChunks = textChunks.map(s => s.trim()).filter(s => s.length > 0);
            currentChunkIndex = 0;
            customIsSpeaking = true;
            customIsPaused = false;
            currentPauseBtn = pauseBtnElement;
            if (currentPauseBtn) {
                currentPauseBtn.innerHTML = '⏸️';
                currentPauseBtn.title = 'Пауза';
            }
            playNextChunk();
        }

        function playNextChunk() {
            if (customIsPaused || currentChunkIndex >= textChunks.length) {
                if (currentChunkIndex >= textChunks.length) stopAllAudio();
                return;
            }
            if (!germanVoice) initVoice();
            const msg = new SpeechSynthesisUtterance(textChunks[currentChunkIndex]);
            msg.lang = 'de-DE';
            msg.rate = 0.85;
            if (germanVoice) msg.voice = germanVoice;
            msg.onend = () => {
                if (customIsPaused) return; 
                currentChunkIndex++;
                playNextChunk();
            };
            msg.onerror = () => {};
            window.speechSynthesis.speak(msg);
        }

        function togglePause(btn) {
            if (!customIsSpeaking) return;
            if (customIsPaused) {
                customIsPaused = false;
                btn.innerHTML = '⏸️';
                btn.title = 'Пауза';
                playNextChunk();
            } else {
                customIsPaused = true;
                window.speechSynthesis.cancel();
                btn.innerHTML = '▶️';
                btn.title = 'Продолжить';
            }
        }

        function speakFullText(btn) {
            if (customIsSpeaking && currentPauseBtn === btn) {
                togglePause(btn);

            const container = btn.closest('.section').querySelector('.content');

            speakText(fullText, btn);

        function normalizeText(s) {
            return s.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.!?]+$/, '');
        }

        function checkTextAnswer(btn) {
            const answerRaw = btn.dataset.answer;
            const alternatives = answerRaw.split('/').map(a => normalizeText(a));
            const textarea = btn.parentElement.parentElement.querySelector('textarea');
            const userVal = normalizeText(textarea.value);
            const result = btn.parentElement.parentElement.querySelector('.result');
            result.style.display = 'block';
            
            if (userVal.length > 0 && alternatives.includes(userVal)) {
                result.className = 'result show correct'; 
                result.textContent = '✓ Верно!';
            } else {
                result.className = 'result show incorrect'; 
                result.textContent = '✗ Неверно. Ответ: ' + answerRaw;
            }
        }

        function checkTextAnswerInput(btn) {
            const input = btn.parentElement.parentElement.querySelector('input');
            const answerRaw = input.dataset.answer;
            const userVal = normalizeText(input.value);
            const alternatives = answerRaw.split('/').map(a => normalizeText(a));
            const result = btn.parentElement.parentElement.querySelector('.result');
            result.style.display = 'block';
            
            if (userVal.length > 0 && alternatives.includes(userVal)) {
                result.className = 'result show correct'; 
                result.textContent = '✓ Верно!';
            } else {
                result.className = 'result show incorrect'; 
                result.textContent = '✗ Неверно. Ответ: ' + answerRaw;
            }
        }
        
        function revealAnswerInput(btn) {
            const answer = btn.parentElement.parentElement.querySelector('.check-btn[data-answer]')?.dataset.answer || btn.dataset.answer || "См. ключи к заданию.";
            const result = btn.parentElement.parentElement.querySelector('.result');
            result.style.display = 'block';
            result.className = 'result show correct'; 
            result.textContent = 'Ответ: ' + answer;
        }
