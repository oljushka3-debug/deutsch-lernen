        function loadLesson(id) {
            const lesson = lessons.find(l => l.id === id);
            if (!lesson) return;

            document.querySelectorAll('.lesson-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.lesson-btn').classList.add('active');

            document.getElementById('lessonTitle').textContent = lesson.title;
            document.getElementById('lessonSubtitle').textContent = lesson.subtitle;

            let html = `
                <div class="section">
                    <h2>✓ Цели лекции</h2>
                    <div class="goals">
                        <ul>
            `;

            lesson.goals.forEach(goal => {
                html += `<li>${goal}</li>`;
            });

            html += `
                        </ul>
                    </div>
                </div>
            `;

            lesson.sections.forEach((section, idx) => {
                html += `
                    <div class="section">
                        <h2>
                            <span>${section.title}</span>
                            <button class="toggle-btn show" onclick="toggleSection(this)"></button>
                        </h2>
                        <div class="content visible">
                            ${section.content}
                        </div>
                    </div>
                `;
            });

            document.getElementById('content').innerHTML = html;

            // Initialize exercises
            if (id === 1) {
                initExercises1();
            } else if (id === 2) {
                initExercises2();
            }

            document.getElementById('content').scrollTop = 0;

            initAudio();
        }

        function toggleSection(btn) {
            const content = btn.parentElement.parentElement.querySelector('.content');
            content.classList.toggle('visible');
            btn.classList.toggle('show');
            btn.classList.toggle('hide');
        }

        function checkAnswer(btn, correctAnswer) {
            const input = btn.parentElement.querySelector('input');
            const userAnswer = input.value.trim().toLowerCase();
            const result = btn.parentElement.querySelector('.result');

            if (userAnswer === correctAnswer.toLowerCase()) {
                result.className = 'result show correct';
                result.textContent = '✓ Верно!';
            } else {
                result.className = 'result show incorrect';
                result.textContent = `✗ Неверно. Ответ: ${correctAnswer}`;
            }
        }

        function showAnswer(btn) {
            const result = btn.parentElement.querySelector('.result');
            result.className = 'result show';
            result.style.display = 'block';
            result.textContent = 'Открой раздел "🔑 Ключи (ответы)" ниже, чтобы свериться';
        }

        function revealAnswer(btn) {
            const answer = btn.dataset.answer;
            const result = btn.parentElement.querySelector('.result');
            result.className = 'result show correct';
            result.style.display = 'block';
            result.textContent = '✓ Правильный ответ: ' + answer;
        }

        function normalizeText(s) {
            return s.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.!?]+$/, '');
        }

        function checkTextAnswer(btn) {
            const answerRaw = btn.dataset.answer;
            const alternatives = answerRaw.split('/').map(a => normalizeText(a));
            const textarea = btn.parentElement.querySelector('textarea');
            const userVal = normalizeText(textarea.value);
            const result = btn.parentElement.querySelector('.result');
            result.style.display = 'block';
            if (userVal.length > 0 && alternatives.includes(userVal)) {
                result.className = 'result show correct';
                result.textContent = '✓ Верно!';
            } else {
                result.className = 'result show incorrect';
                result.textContent = '✗ Неверно. Попробуйте ещё раз.';
            }
        }

        let germanVoice = null;

        function initVoice() {
            let voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;
            const priorityKeywords = ['Google', 'Premium', 'Enhanced', 'Neural', 'Natural', 'Online'];
            germanVoice = voices.find(v => v.lang.startsWith('de') && priorityKeywords.some(k => v.name.includes(k)));
            if (!germanVoice) {
                germanVoice = voices.find(v => v.lang.startsWith('de'));
            }
        }

        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = initVoice;
        }
        initVoice();

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                if (!germanVoice) initVoice();
                const msg = new SpeechSynthesisUtterance(text.trim());
                msg.lang = 'de-DE';
                msg.rate = 0.85;
                if (germanVoice) msg.voice = germanVoice;
                window.speechSynthesis.speak(msg);
            }
        }

        function initAudio() {
            document.querySelectorAll('.speak-sentence, .speak-vocab').forEach(el => {
                if (el.querySelector('.play-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'play-btn';
                btn.innerHTML = '🔊';
                btn.style.marginLeft = '5px';
                if(el.classList.contains('speak-vocab')) {
                    btn.style.position = 'relative';
                    btn.style.display = 'inline-flex';
                    btn.style.transform = 'none';
                    btn.style.width = '20px';
                    btn.style.height = '20px';
                    btn.style.fontSize = '12px';
                    btn.style.background = 'none';
                    el.insertAdjacentElement('afterend', btn);
                } else {
                    el.appendChild(btn);
                }
                btn.onclick = (e) => {
                    e.stopPropagation();
                    speakText(el.textContent.replace('🔊', '').trim());
                };
            });
        }

        function speakFullText(btn) {
            const container = btn.closest('.section').querySelector('.content');
            const sentences = Array.from(container.querySelectorAll('.speak-sentence')).map(el => el.textContent.replace('🔊','').trim());
            const fullText = sentences.join('. ');
            if (!fullText) return;
            speakText(fullText);
        }

        // Initialize
        loadLesson(1);
    </script>
