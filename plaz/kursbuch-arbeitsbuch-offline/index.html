<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berliner Platz 1 — Kursbuch и Arbeitsbuch 1–6</title>
    <link rel="stylesheet" href="./app.css">
  </head>
  <body>
    <script>
      // GitHub Pages SPA redirect trick: если 404.html передал сюда сохранённый путь,
      // восстанавливаем его перед тем, как приложение начнёт роутинг.
      (function () {
        var saved = sessionStorage.getItem('spa-redirect-path');
        if (saved) {
          sessionStorage.removeItem('spa-redirect-path');
          var basePath = window.location.pathname.replace(/\/[^/]*$/, '/');
          if (saved.indexOf(basePath) === 0) {
            window.history.replaceState(null, '', saved);
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script src="./app.js"></script>
  </body>
</html>
