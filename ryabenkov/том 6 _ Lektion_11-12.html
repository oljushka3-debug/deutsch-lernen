        function speakText(text, pauseBtnElement = null) {
            stopAllAudio();
            textChunks = text.match(/[^.!?]+[.!?]*/g) || [text];
            textChunks = textChunks.map(s => s.trim()).filter(s => s.length > 0);

            currentPauseBtn = pauseBtnElement;

                currentPauseBtn.innerHTML = '⏸️';

            }
            playNextChunk();
        }

        function playNextChunk() {
            if (customIsPaused || currentChunkIndex >= textChunks.length) {
                if (currentChunkIndex >= textChunks.length) stopAllAudio();
                return;
            }
            if (!germanVoice) initVoice();
            const msg = new SpeechSynthesisUtterance(textChunks[currentChunkIndex]);
            msg.lang = 'de-DE';
            msg.rate = 0.85;
            if (germanVoice) msg.voice = germanVoice;
            msg.onend = () => {
                if (customIsPaused) return; 
                currentChunkIndex++;
                playNextChunk();
            };
            msg.onerror = () => {};
            window.speechSynthesis.speak(msg);
        }

        function togglePause(btn) {
            if (!customIsSpeaking) return;

        function normalizeText(s) {
            return s.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.!?]+$/, '');
        }

        function checkTextAnswer(btn) {
            const answerRaw = btn.dataset.answer;
            const alternatives = answerRaw.split('/').map(a => normalizeText(a));
            const textarea = btn.parentElement.parentElement.querySelector('textarea');
            const userVal = normalizeText(textarea.value);
            const result = btn.parentElement.parentElement.querySelector('.result');
            result.style.display = 'block';
            
            if (userVal.length > 0 && alternatives.includes(userVal)) {
                result.className = 'result show correct'; 
                result.textContent = '✓ Верно!';
            } else {
                result.className = 'result show incorrect'; 
                result.textContent = '✗ Неверно. Ответ: ' + answerRaw;
            }
        }

        function checkTextAnswerInput(btn) {
            const input = btn.parentElement.parentElement.querySelector('input');
            const answerRaw = input.dataset.answer;
            const userVal = normalizeText(input.value);
            const alternatives = answerRaw.split('/').map(a => normalizeText(a));
            const result = btn.parentElement.parentElement.querySelector('.result');
            result.style.display = 'block';

            }
        }
