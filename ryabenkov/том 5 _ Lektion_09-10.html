                            <div class="theory-block">

                                <p style="margin-top: 10px;">Давайте вспомним:</p>
                                <ul>

                                <p style="margin-top: 10px;">В немецком языке существует также модальный глагол <strong>mögen</strong>. В сослагательном наклонении Konjunktiv он выражает модальность желания и приобретает значение <strong>«хотеть бы»</strong> (вежливая, мягкая формулировка).</p>
                            </div>
                            
                            <h3>Спряжение mögen в Konjunktiv:</h3>
                            <table>
                                <tr><th>Лицо</th><th>Форма</th><th>Перевод</th></tr>
                                <tr><td>ich</td><td><strong>möchte</strong></td><td>я хотел бы</td></tr>
                                <tr><td>du</td><td><strong>möchtest</strong></td><td>ты хотел бы</td></tr>
                                <tr><td>er, sie, es</td><td><strong>möchte</strong></td><td>он, она, оно хотел бы</td></tr>
                                <tr><td>wir</td><td><strong>möchten</strong></td><td>мы хотели бы</td></tr>
                                <tr><td>ihr</td><td><strong>möchtet</strong></td><td>вы хотели бы</td></tr>
                                <tr><td>sie / Sie</td><td><strong>möchten</strong></td><td>они / Вы хотели бы</td></tr>

                            <ul>

                            <ul><li><span class="speak-sentence">Ich möchte keinen Kuchen.</span> (Я не хочу пирога - вообще любого.)</li></ul>

                            <ul><li><span class="speak-sentence">Ich möchte diesen Kuchen nicht.</span> (Я не хочу этот пирог.)</li></ul>
                        `

        let germanVoice = null;
        let textChunks = [];
        let currentChunkIndex = 0;
        let customIsPaused = false;
        let customIsSpeaking = false;
        let currentPauseBtn = null;

        function initVoice() {
            let voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) return;
            const priorityKeywords = ['Google', 'Premium', 'Enhanced', 'Neural', 'Natural', 'Online'];
            germanVoice = voices.find(v => v.lang.startsWith('de') && priorityKeywords.some(k => v.name.includes(k)));
            if (!germanVoice) {
                germanVoice = voices.find(v => v.lang.startsWith('de'));
            }
        }

        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = initVoice;
        }

        function resetAllPauseButtons() {
            document.querySelectorAll('.pause-btn').forEach(btn => {
                btn.innerHTML = '⏸️';
                btn.title = 'Пауза';
            });
        }

        function stopAllAudio() {
            window.speechSynthesis.cancel();
            customIsSpeaking = false;
            customIsPaused = false;
            resetAllPauseButtons();
        }

        function speakText(text, pauseBtnElement = null) {
            stopAllAudio();
            textChunks = text.match(/[^.!?]+[.!?]*/g) || [text];
            textChunks = textChunks.map(s => s.trim()).filter(s => s.length > 0);
            currentChunkIndex = 0;
            customIsSpeaking = true;
            customIsPaused = false;
            currentPauseBtn = pauseBtnElement;
            if (currentPauseBtn) {
                currentPauseBtn.innerHTML = '⏸️';
                currentPauseBtn.title = 'Пауза';
            }
            playNextChunk();
        }

        function playNextChunk() {
            if (customIsPaused || currentChunkIndex >= textChunks.length) {
                if (currentChunkIndex >= textChunks.length) stopAllAudio();
                return;
            }
            if (!germanVoice) initVoice();
            const msg = new SpeechSynthesisUtterance(textChunks[currentChunkIndex]);
            msg.lang = 'de-DE';
            msg.rate = 0.85;
            if (germanVoice) msg.voice = germanVoice;
            msg.onend = () => {
                if (customIsPaused) return; 
                currentChunkIndex++;
                playNextChunk();
            };
            msg.onerror = () => {};
            window.speechSynthesis.speak(msg);
        }

        function togglePause(btn) {
            if (!customIsSpeaking) return;
            if (customIsPaused) {
                customIsPaused = false;
                btn.innerHTML = '⏸️';
                btn.title = 'Пауза';
                playNextChunk();
            } else {
                customIsPaused = true;
                window.speechSynthesis.cancel();
                btn.innerHTML = '▶️';
                btn.title = 'Продолжить';
            }
        }

        function speakFullText(btn) {
            if (customIsSpeaking && currentPauseBtn === btn) {
                togglePause(btn);
                return;
            }
            const container = btn.closest('.section').querySelector('.content');
            const sentences = Array.from(container.querySelectorAll('.speak-sentence')).map(el => el.textContent.replace('🔊','').trim());
            const fullText = sentences.join('. ');
            if (!fullText) return;
            speakText(fullText, btn);
        }

        function initAudioButtons() {
            // Для отдельных фраз (.speak-sentence)
            document.querySelectorAll('.speak-sentence').forEach(el => {
                if (!el.querySelector('.play-btn')) {
                    const btn = document.createElement('button');
                    btn.className = 'play-btn';
                    btn.innerHTML = '🔊';
                    btn.title = 'Послушать';
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        let pureText = el.textContent.replace('🔊', '').trim();
                        speakText(pureText);
                    };
                    el.appendChild(btn);
                }
            });

            // Для отдельных слов (.speak-vocab)
            document.querySelectorAll('.speak-vocab').forEach(el => {
                if (!el.nextElementSibling || !el.nextElementSibling.classList.contains('play-btn')) {
                    const textToSpeak = el.textContent.trim();
                    const btn = document.createElement('button');
                    btn.className = 'play-btn';
                    btn.innerHTML = '🔊';
                    btn.title = 'Послушать';
                    btn.style.position = 'relative';
                    btn.style.display = 'inline-flex';
                    btn.style.transform = 'none';
                    btn.style.marginLeft = '5px';
                    btn.style.width = '20px';
                    btn.style.height = '20px';
                    btn.style.fontSize = '12px';
                    btn.style.background = 'none';

                    btn.onclick = (e) => {
                        e.stopPropagation();
                        let pureText = textToSpeak.replace('🔊', '').trim();
                        speakText(pureText);
                    };
                    el.insertAdjacentElement('afterend', btn);
                }
            });
        }

            let html = `<div class="section"><h2>✓ Цели лекции</h2><div class="goals"><ul>`;

            html += `</ul></div></div>`;

            lesson.sections.forEach((section) => {
                html += `<div class="section"><h2><span>${section.title}</span><button class="toggle-btn show" onclick="toggleSection(this)"></button></h2><div class="content visible">${section.content}</div></div>`;
            });

            if (id === 10) initExercises10();

        function normalizeText(s) {
            return s.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.!?]+$/, '');
        }

        function checkTextAnswer(btn) {
            const answerRaw = btn.dataset.answer;
            const alternatives = answerRaw.split('/').map(a => normalizeText(a));

            const userVal = normalizeText(textarea.value);
            const result = btn.parentElement.parentElement.querySelector('.result');
            result.style.display = 'block';
            
            if (userVal.length > 0 && alternatives.includes(userVal)) {
                result.className = 'result show correct'; 
                result.textContent = '✓ Верно!';
            } else {
                result.className = 'result show incorrect'; 
                result.textContent = '✗ Неверно. Ответ: ' + answerRaw;
            }
        }

        function checkTextAnswerInput(btn) {
            const input = btn.parentElement.parentElement.querySelector('input');
            const answerRaw = input.dataset.answer;
            const userVal = normalizeText(input.value);
            const alternatives = answerRaw.split('/').map(a => normalizeText(a));
            const result = btn.parentElement.parentElement.querySelector('.result');
            result.style.display = 'block';
            
            if (userVal.length > 0 && alternatives.includes(userVal)) {
                result.className = 'result show correct'; 
                result.textContent = '✓ Верно!';
