    <script>
        const lessons = [
            // ================= Lektion 03 =================
            {
                id: 3,
                title: 'Lektion 03',
                subtitle: 'Артикли, квартира, множественное число',
                goals: [
                    'научитесь использовать определенные, неопределенные, притяжательные артикли и отрицательный артикль kein',
                    'познакомитесь со множественным числом существительных',
                    'научитесь описывать свою квартиру'
                ],
                sections: [
                    {
                        title: 'Имя существительное (Das Substantiv) и определенный артикль',
                        content: `
                            <div class="theory-block">
                                <p><strong>В немецком языке все существительные пишутся с заглавной буквы!</strong></p>
                                <p style="margin-top: 10px;">Перед существительным ставится артикль, который указывает на его род, число и падеж.</p>
                            </div>
                            <h3>Определенный артикль (1-й тип)</h3>
                            <table>
                                <tr><th>Мужской род (der)</th><th>Средний род (das)</th><th>Женский род (die)</th></tr>
                                <tr><td><span class="speak-vocab">der Mann</span> [дэа ман] мужчина/муж</td><td><span class="speak-vocab">das Kind</span> [дас кинт] ребенок</td><td><span class="speak-vocab">die Frau</span> [ди фрау] женщина/жена</td></tr>
                                <tr><td><span class="speak-vocab">der Tisch</span> [деа тыш] стол</td><td><span class="speak-vocab">das Mädchen</span> [дас мэтхен] девочка</td><td><span class="speak-vocab">die Wohnung</span> [ди вонун] квартира</td></tr>
                                <tr><td><span class="speak-vocab">der Stuhl</span> [деа штуль] стул</td><td><span class="speak-vocab">das Zimmer</span> [дас цима] комната</td><td><span class="speak-vocab">die Uhr</span> [ди уа] часы</td></tr>
                                <tr><td><span class="speak-vocab">der Computer</span> [дэа компьюта] компьютер</td><td><span class="speak-vocab">das Buch</span> [дас бух] книга</td><td><span class="speak-vocab">die Lampe</span> [ди лампе] лампа</td></tr>
                            </table>
                        `
                    },
                    {
                        title: 'Неопределенный артикль (ein, eine) и конструкция das ist...',
                        content: `
                            <div class="theory-block">
                                <p>Неопределённый артикль <strong>«ein / eine»</strong> (от немецкого eins - один) используется, когда что-то упоминается впервые для вашего собеседника. В этом случае перед существительным вполне можно подставить такие слова как «один», «одна», «какой-нибудь», «какая-нибудь» и т.д.</p>
                                <p style="margin-top: 10px;">В русском языке мы тоже иногда используем подобный артикль, например: «одна бабка сказала».</p>
                                <p style="margin-top: 10px;">«das» - это не только артикль среднего рода (das Kind - ребенок), но и указательное местоимение, которое переводится как «это» (Это - ложка, это - чашка). Так совпало, что артикль среднего рода das и местоимение das выглядят одинаково.</p>
                                <p style="margin-top: 10px;">Все помнят фразу «das ist fantastisch»? Слово «das» переводится здесь именно как «это». А вопрос - Что это? будет звучать так: <span class="speak-sentence">Was ist das?</span></p>
                                <p style="margin-top: 10px;">Если «das ist…» используется с существительным, то его принято использовать с неопределенным артиклем. Например: <span class="speak-sentence">das ist ein Buch</span> (это книга).</p>
                            </div>
                            <h3>Неопределенный артикль (2-й тип)</h3>
                            <table>
                                <tr><th>der (муж.)</th><th>das (ср.)</th><th>die (жен.)</th></tr>
                                <tr><td><strong>ein</strong></td><td><strong>ein</strong></td><td><strong>eine</strong></td></tr>
                            </table>
                            <h3 style="margin-top: 20px;">Примеры:</h3>
                            <div class="example">
                                <span class="speak-sentence">Das ist ein Mann.</span> <span class="speak-sentence">Das ist ein Tisch.</span> <span class="speak-sentence">Das ist ein Stuhl.</span> <span class="speak-sentence">Das ist ein Computer.</span>
                            </div>
                            <div class="example">
                                <span class="speak-sentence">Das ist ein Kind.</span> <span class="speak-sentence">Das ist ein Mädchen.</span> <span class="speak-sentence">Das ist ein Zimmer.</span> <span class="speak-sentence">Das ist ein Buch.</span>
                            </div>
                            <div class="example">
                                <span class="speak-sentence">Das ist eine Frau.</span> <span class="speak-sentence">Das ist eine Wohnung.</span> <span class="speak-sentence">Das ist eine Uhr.</span> <span class="speak-sentence">Das ist eine Lampe.</span>
                            </div>
                        `
                    },
                    {
                        title: 'Отрицательный артикль kein',
                        content: `
                            <div class="theory-block">
                                <p>Отрицательные предложения обычно строятся с помощью <strong>«nicht»</strong>, которое ставится после глагола (об этом мы говорили на прошлом занятии): <span class="speak-sentence">Ich komme nicht</span> (я не приду).</p>
                                <p style="margin-top: 10px;">Но! Чтобы построить такие предложения, как: «это не стол», «это не книга», используется отрицательный артикль <strong>«kein»</strong>, который ставится только ИСКЛЮЧИТЕЛЬНО перед существительным (как и все артикли).</p>
                                <p style="margin-top: 10px;">Обратите внимание на тенденцию, что в женском роде к артиклю добавляется «е».</p>
                            </div>
                            <h3>Отрицательный артикль (3-й тип)</h3>
                            <table>
                                <tr><th>der (муж.)</th><th>das (ср.)</th><th>die (жен.)</th></tr>
                                <tr><td><strong>kein</strong></td><td><strong>kein</strong></td><td><strong>keine</strong></td></tr>
                            </table>
                            <h3 style="margin-top: 20px;">Давайте потренируемся! Ответьте утвердительно и отрицательно на вопросы:</h3>
                            <div class="example">
                                <div><span class="speak-sentence">- Ist das ein Haus?</span></div><div class="translation">(- Это дом?)</div>
                            </div>
                            <div class="example">
                                <div><span class="speak-sentence">- Ja, das ist ein Haus.</span></div><div class="translation">(- Да, это дом.)</div>
                            </div>
                            <div class="example">
                                <div><span class="speak-sentence">- Nein, das ist kein Haus.</span></div><div class="translation">(- Нет, это не дом)</div>
                            </div>
                            <h3 style="margin-top: 20px;">Запомните слова:</h3>
                            <ul>
                                <li><span class="speak-vocab">der Apfel</span> (яблоко), <span class="speak-vocab">die Banane</span> (банан), <span class="speak-vocab">die Katze</span> (кошка), <span class="speak-vocab">das Kind</span> (ребенок), <span class="speak-vocab">die Frau</span> (женщина), <span class="speak-vocab">das Buch</span> (книга), <span class="speak-vocab">die Lampe</span> (лампа), <span class="speak-vocab">der Tisch</span> (стол), <span class="speak-vocab">der Stuhl</span> (стул), <span class="speak-vocab">die Uhr</span> (часы), <span class="speak-vocab">der Baum</span> (дерево), <span class="speak-vocab">die Tür</span> (дверь), <span class="speak-vocab">der Zug</span> (поезд), <span class="speak-vocab">das Flugzeug</span> (самолет), <span class="speak-vocab">das Heft</span> (тетрадь), <span class="speak-vocab">der Stift</span> (ручка), <span class="speak-vocab">der Bleistift</span> (карандаш), <span class="speak-vocab">die Küche</span> (кухня), <span class="speak-vocab">das Badezimmer</span> (ванная комната), <span class="speak-vocab">das Bett</span> (кровать), <span class="speak-vocab">das Fenster</span> (окно), <span class="speak-vocab">das Bild</span> (картина).</li>
                            </ul>
                        `
                    },
                    {
                        title: 'Притяжательные артикли',
                        content: `
                            <div class="theory-block">
                                <p>Притяжательные артикли (местоимения) - это такие слова как «мой», «твой» и т.д.</p>
                                <p style="margin-top: 10px;">Иногда нужно указать, что вещь принадлежит кому-то, например: «это моя книга», «это его стол». В таком случае мы используем в русском языке притяжательные местоимения «мой», «твой», «свой», «наш», «ваш», «его», «ее», «их».</p>
                                <p style="margin-top: 10px;">Ещё! В немецком языке притяжательные местоимения склоняются по родам и числам как неопределенный и отрицательный артикль (получают в конце «е»).</p>
                            </div>
                            <h3>Притяжательные артикли (4-й тип)</h3>
                            <table>
                                <tr><th>Кто?</th><th>Мужской род (der)</th><th>Средний род (das)</th><th>Женский род (die)</th></tr>
                                <tr><td>ich</td><td><strong>mein</strong></td><td><strong>mein</strong></td><td><strong>meine</strong></td></tr>
                                <tr><td>du</td><td><strong>dein</strong></td><td><strong>dein</strong></td><td><strong>deine</strong></td></tr>
                                <tr><td>er</td><td><strong>sein</strong></td><td><strong>sein</strong></td><td><strong>seine</strong></td></tr>
                                <tr><td>sie</td><td><strong>ihr</strong></td><td><strong>ihr</strong></td><td><strong>ihre</strong></td></tr>
                                <tr><td>es</td><td><strong>sein</strong></td><td><strong>sein</strong></td><td><strong>seine</strong></td></tr>
                                <tr><td>wir</td><td><strong>unser</strong></td><td><strong>unser</strong></td><td><strong>unsere</strong></td></tr>
                                <tr><td>ihr</td><td><strong>euer</strong></td><td><strong>euer</strong></td><td><strong>eure</strong></td></tr>
                                <tr><td>sie</td><td><strong>ihr</strong></td><td><strong>ihr</strong></td><td><strong>ihre</strong></td></tr>
                                <tr><td>Sie</td><td><strong>Ihr</strong></td><td><strong>Ihr</strong></td><td><strong>Ihre</strong></td></tr>
                            </table>
                            <h3 style="margin-top: 20px;">Примеры:</h3>
                            <div class="example">
                                <span class="speak-sentence">1. Das ist mein Mann.</span> <span class="speak-sentence">2. Das ist dein Tisch.</span> <span class="speak-sentence">3. Das ist Ihr Stuhl.</span> <span class="speak-sentence">4. Das ist sein Computer.</span>
                            </div>
                            <div class="example">
                                <span class="speak-sentence">1. Das ist unser Kind.</span> <span class="speak-sentence">2. Das ist ihr Mädchen.</span> <span class="speak-sentence">3. Das ist euer Zimmer.</span> <span class="speak-sentence">4. Das ist Ihr Buch.</span>
                            </div>
                            <div class="example">
                                <span class="speak-sentence">1. Das ist meine Frau.</span> <span class="speak-sentence">2. Das ist deine Wohnung.</span> <span class="speak-sentence">3. Das ist seine Uhr.</span> <span class="speak-sentence">4. Das ist ihre Lampe.</span>
                            </div>
                        `
                    },
                    {
                        title: 'Множественное число существительных',
                        content: `
                            <div class="theory-block">
                                <p>Вы уже хорошо усвоили артикли der, das и die. Для множественного числа используется артикль - <strong>die</strong> (изначальный род слова при этом значения не имеет).</p>
                                <p style="margin-top: 10px;">Таким образом, <strong>die</strong> - это определенный артикль женского рода и определенный артикль множественного числа. Это всего лишь совпадение.</p>
                            </div>
                            <h3>Сводная таблица артиклей (+ множественное число)</h3>
                            <table>
                                <tr><th>Тип артикля</th><th>der</th><th>das</th><th>die</th><th>die (мн. число)</th></tr>
                                <tr><td>Определенный</td><td>der</td><td>das</td><td>die</td><td><strong>die</strong></td></tr>
                                <tr><td>Неопределенный</td><td>ein</td><td>ein</td><td>eine</td><td><strong>нет</strong></td></tr>
                                <tr><td>Отрицательный</td><td>kein</td><td>kein</td><td>keine</td><td><strong>keine</strong></td></tr>
                                <tr><td>Притяжательный (mein)</td><td>mein</td><td>mein</td><td>meine</td><td><strong>meine</strong></td></tr>
                            </table>
                            <h3 style="margin-top: 20px;">Примеры:</h3>
                            <div class="example">
                                <span class="speak-sentence">1. Das sind Männer.</span> <span class="speak-sentence">2. Das sind Tische.</span> <span class="speak-sentence">3. Das sind Stühle.</span> <span class="speak-sentence">4. Das sind Computer.</span>
                            </div>
                            <div class="example">
                                <span class="speak-sentence">1. Das sind Kinder.</span> <span class="speak-sentence">2. Das sind Mädchen.</span> <span class="speak-sentence">3. Das sind Zimmer.</span> <span class="speak-sentence">4. Das sind Bücher.</span>
                            </div>
                            <div class="example">
                                <span class="speak-sentence">1. Das sind Frauen.</span> <span class="speak-sentence">2. Das sind Wohnungen.</span> <span class="speak-sentence">3. Das sind Uhren.</span> <span class="speak-sentence">4. Das sind Lampen.</span>
                            </div>

                            <h3 style="margin-top: 20px;">Конструкция Hier ist / Hier sind</h3>
                            <p>Употребляется, когда вы хотите показать или представить один или несколько объектов. Когда вы передаете что-то человеку или указываете на него.</p>
                            <ul>
                                <li><strong>Hier ist:</strong> переводится как "Вот" или "Здесь есть" и используется с существительными в единственном числе.<br>
                                <span class="speak-sentence">Hier ist mein Buch.</span> (Вот моя книга.) <span class="speak-sentence">Hier ist mein Handy.</span> (Вот мой телефон.)</li>
                                <li><strong>Hier sind:</strong> переводится как "Вот" или "Здесь есть" и используется с существительными во множественном числе.<br>
                                <span class="speak-sentence">Hier sind meine Bücher.</span> (Вот мои книги.) <span class="speak-sentence">Hier sind ein Tisch und ein Stuhl.</span> (Здесь есть стол и стул).</li>
                            </ul>
                        `

        function normalizeText(s) {
            return s.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.!?]+$/, '');
        }

        function checkTextAnswer(btn) {
            const answerRaw = btn.dataset.answer;
            const alternatives = answerRaw.split('/').map(a => normalizeText(a));
            const textarea = btn.parentElement.parentElement.querySelector('textarea');
            const userVal = normalizeText(textarea.value);
            const result = btn.parentElement.parentElement.querySelector('.result');
            result.style.display = 'block';
            
            if (userVal.length > 0 && alternatives.includes(userVal)) {
                result.className = 'result show correct'; 
                result.textContent = '✓ Верно!';
            } else {
                result.className = 'result show incorrect'; 
                result.textContent = '✗ Неверно. Попробуйте ещё раз.';
            }
        }

        function checkTextAnswerInput(btn) {
            const input = btn.parentElement.parentElement.querySelector('input');
            const answerRaw = input.dataset.answer;
            const userVal = normalizeText(input.value);
            const alternatives = answerRaw.split('/').map(a => normalizeText(a));
            const result = btn.parentElement.parentElement.querySelector('.result');
            result.style.display = 'block';
            
            if (userVal.length > 0 && alternatives.includes(userVal)) {
                result.className = 'result show correct'; 
                result.textContent = '✓ Верно!';
            } else {
                result.className = 'result show incorrect'; 
                result.textContent = '✗ Неверно. Попробуйте ещё раз.';
            }
        }
        
        function revealAnswerInput(btn) {
            const answer = btn.dataset.answer;
            const result = btn.parentElement.parentElement.querySelector('.result');
            result.style.display = 'block';
            result.className = 'result show correct'; 
            result.textContent = '✓ Правильный ответ: ' + answer;
        }

        // Запуск
        loadLesson(3);
    </script>
